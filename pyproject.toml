[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "suika-elika"
version = "0.1.0"
description = "Jogo de queda e fusão de frutas para Batocera."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pygame>=2.6.1,<3",
    "pymunk>=7.3,<8",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13,<2",
    "pytest>=8,<10",
    "ruff>=0.14,<1",
]

[tool.setuptools.packages.find]
include = ["suika_elika*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]

[tool.ruff]
target-version = "py310"
line-length = 100
include = ["suika_elika/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["suika_elika"]
warn_unused_configs = true
